<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diduo Bot — Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f5f6fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    padding: 32px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  h1 { font-size: 20px; color: #111; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #999; margin-bottom: 28px; }
  label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
  select, input {
    width: 100%; padding: 9px 12px;
    border: 1px solid #e5e7eb; border-radius: 8px;
    font-size: 13px; color: #111;
    background: #fafafa; margin-bottom: 16px;
    outline: none;
  }
  select:focus, input:focus { border-color: #1d4ed8; background: #fff; }
  .btn {
    width: 100%; padding: 11px;
    background: #1d4ed8; color: #fff;
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; margin-bottom: 20px;
  }
  .btn:hover { background: #1e40af; }
  .result-box {
    background: #f0f4ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 14px 16px;
    display: none;
    margin-bottom: 16px;
  }
  .result-label { font-size: 11px; color: #6b7280; margin-bottom: 6px; }
  .result-key {
    font-family: monospace; font-size: 15px;
    font-weight: 700; color: #1d4ed8;
    letter-spacing: 1px;
  }
  .copy-btn {
    background: none; border: 1px solid #1d4ed8;
    color: #1d4ed8; border-radius: 6px;
    padding: 4px 12px; font-size: 12px;
    cursor: pointer; margin-top: 8px;
  }
  .copy-btn:hover { background: #1d4ed8; color: #fff; }
  hr { border: none; border-top: 1px solid #e5e7eb; margin: 20px 0; }
  .keys-list { max-height: 220px; overflow-y: auto; }
  .key-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 7px; margin-bottom: 4px;
    background: #f8f8f8; font-size: 12px;
  }
  .key-row:hover { background: #f0f4ff; }
  .key-text { font-family: monospace; color: #111; }
  .badge {
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
    margin-left: 8px;
  }
  .weekly  { background: #fef3c7; color: #92400e; }
  .monthly { background: #d1fae5; color: #065f46; }
  .expired { background: #fee2e2; color: #991b1b; }
  .del-btn {
    background: none; border: none;
    color: #dc2626; cursor: pointer;
    font-size: 16px; padding: 0 4px;
  }
  .expiry { color: #999; font-size: 11px; margin-left: 4px; }
  .paste-area {
    width: 100%; min-height: 100px;
    padding: 10px; font-family: monospace;
    font-size: 12px; border: 1px solid #e5e7eb;
    border-radius: 8px; resize: vertical;
    margin-bottom: 10px; background: #fafafa;
  }
  .note { font-size: 11px; color: #999; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <h1>Diduo Bot</h1>
  <div class="sub">Admin Panel — License Key Generator</div>

  <!-- Generate -->
  <label>Key type</label>
  <select id="keyType">
    <option value="WEEKLY">Weekly (7 days)</option>
    <option value="MONTHLY">Monthly (30 days)</option>
  </select>

  <label>Note (optional)</label>
  <input type="text" id="keyNote" placeholder="e.g. customer name">

  <button class="btn" onclick="generateKey()">Generate key</button>

  <div class="result-box" id="resultBox">
    <div class="result-label">Generated key</div>
    <div class="result-key" id="resultKey"></div>
    <div style="font-size:11px;color:#6b7280;margin-top:4px;" id="resultExpiry"></div>
    <button class="copy-btn" onclick="copyKey()">Copy</button>
  </div>

  <hr>

  <!-- keys.txt builder -->
  <label>Keys list (paste your current keys.txt content here)</label>
  <textarea class="paste-area" id="keysArea" placeholder="Gamal-WEEKLY-A3F9K2|WEEKLY|2026-09-07&#10;Gamal-MONTHLY-X7Z1P4|MONTHLY|2026-09-30"></textarea>

  <button class="btn" style="background:#16a34a;margin-bottom:8px" onclick="parseKeys()">Load & preview keys</button>

  <div class="keys-list" id="keysList"></div>

  <div id="exportArea" style="display:none;margin-top:16px;">
    <label>Updated keys.txt — copy and paste into your GitHub file</label>
    <textarea class="paste-area" id="exportText" style="min-height:80px;" readonly></textarea>
  </div>

  <hr>
  <div class="note">
    ① Generate a key → copy it → give it to customer<br>
    ② Add it manually to your <b>keys.txt</b> on GitHub in the format:<br>
    <code>KEY|TYPE|YYYY-MM-DD</code>
  </div>
</div>

<script>
  function rnd(n) {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < n; i++)
      s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function generateKey() {
    const type = document.getElementById('keyType').value;
    const days = type === 'WEEKLY' ? 7 : 30;
    const exp  = new Date();
    exp.setDate(exp.getDate() + days);
    const expStr = exp.toISOString().split('T')[0];

    // format: Gamal-TYPE-XXXXXX
    const key = `Gamal-${type}-${rnd(3)}${rnd(3)}`;

    document.getElementById('resultKey').textContent   = key;
    document.getElementById('resultExpiry').textContent = `Expires: ${expStr}  |  Type: ${type}`;
    document.getElementById('resultBox').style.display  = 'block';

    // store for copy
    window._lastKey     = key;
    window._lastExpiry  = expStr;
    window._lastType    = type;
  }

  function copyKey() {
    navigator.clipboard.writeText(window._lastKey || '');
    document.querySelector('.copy-btn').textContent = 'Copied!';
    setTimeout(() => document.querySelector('.copy-btn').textContent = 'Copy', 1500);
  }

  let parsedKeys = [];

  function parseKeys() {
    const raw = document.getElementById('keysArea').value.trim();
    parsedKeys = [];
    const list = document.getElementById('keysList');
    list.innerHTML = '';

    const today = new Date().toISOString().split('T')[0];

    raw.split('\n').forEach(line => {
      line = line.trim();
      if (!line || line.startsWith('#')) return;
      const parts = line.split('|');
      if (parts.length < 3) return;
      const [key, type, expiry] = parts;
      const expired = expiry < today;
      parsedKeys.push({ key, type, expiry, deleted: false });

      const idx = parsedKeys.length - 1;
      const row = document.createElement('div');
      row.className = 'key-row';
      row.id = `row-${idx}`;
      row.innerHTML = `
        <span>
          <span class="key-text">${key}</span>
          <span class="badge ${expired ? 'expired' : type.toLowerCase()}">${expired ? 'EXPIRED' : type}</span>
          <span class="expiry">${expiry}</span>
        </span>
        <button class="del-btn" onclick="deleteKey(${idx})" title="Remove">×</button>
      `;
      list.appendChild(row);
    });

    updateExport();
  }

  function deleteKey(idx) {
    parsedKeys[idx].deleted = true;
    const row = document.getElementById(`row-${idx}`);
    if (row) row.style.opacity = '0.3';
    updateExport();
  }

  function updateExport() {
    const lines = ['# Diduo Bot - License Keys', '# Format: KEY|TYPE|EXPIRY_DATE', '# -----------------------------------'];
    parsedKeys.forEach(k => {
      if (!k.deleted) lines.push(`${k.key}|${k.type}|${k.expiry}`);
    });
    document.getElementById('exportText').value = lines.join('\n');
    document.getElementById('exportArea').style.display = 'block';
  }
</script>
</body>
</html>
